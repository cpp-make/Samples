coverage:
  # acceptable: 90%
  paths:
    - coverage.info
codeToTestRatio:
  # acceptable: current >= 1.2 && diff >= 0.0
  code:
    - 'include/*'
    - 'src/*'
  test:
    - 'test/*.cpp'
testExecutionTime:
  # acceptable: 1min
  if: true
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
